services:
  postgres:
    image: postgres:16-alpine
    container_name: fullstack_postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fullstack_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://appuser:apppass@postgres:5432/appdb
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-a-long-random-secret}
      APP_ENV: production
      DEBUG: "false"
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      JWT_ISSUER: fullstack-starter
      JWT_AUDIENCE: fullstack-starter-client
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fullstack_frontend
    depends_on:
      - backend
    ports:
      - "7000:5173"
    environment:
      - VITE_API_BASE=/api
    restart: unless-stopped

volumes:
  postgres_data:
